<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰语单词本 · 2187 词（priority 5 + 4）</title>
<style>
:root{
  --bg:#ffffff; --surface:#f7f6f3; --line:#e3e1dc; --line2:#cfccc5;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#888780;
  --blue50:#e6f1fb; --blue200:#b5d4f4; --blue600:#185fa5; --blue800:#0c447c;
  --teal50:#e1f5ee; --teal600:#0f6e56;
  --amber50:#faeeda; --amber200:#fac775; --amber600:#854f0b;
  --green50:#eaf3de; --green600:#3b6d11;
  --red50:#fcebeb; --red600:#a32d2d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI","Leelawadee UI","Noto Sans Thai","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6}
.wrap{max-width:940px;margin:0 auto;padding:24px 20px 90px}
h1{font-size:21px;font-weight:500;margin:0 0 4px}
h2{font-size:16px;font-weight:500;margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:8px 0}
.sub{color:var(--tx2);font-size:13px}
a{color:var(--blue600)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--tx2)}
.kpi .v{font-size:20px;font-weight:500;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar>i{display:block;height:100%;background:var(--green600);width:0;transition:width .25s}

.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--tx);cursor:pointer}
button.btn:hover{background:var(--surface)}
button.btn.on{background:var(--blue50);border-color:var(--blue600);color:var(--blue800)}
input[type=text],select{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=range]{vertical-align:middle}

.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.w{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.w:last-child{border-bottom:none}
.w:hover{background:var(--surface)}
.w.playing{background:var(--blue50)}
.w.learned{opacity:.55}
.w .play{flex:0 0 20px;color:var(--blue600);font-size:12px;margin-top:3px}
.w .main{flex:1;min-width:0}
.w .th{font-family:"Leelawadee UI","Noto Sans Thai",sans-serif;font-size:18px;line-height:1.45}
.w .rom{font-size:12px;color:var(--tx2)}
.w .zh{font-size:13px;margin-top:1px}
.w .en{font-size:12px;color:var(--tx2);margin-top:1px}
.w .side{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.mini{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--tx2)}
.mini:hover{background:var(--surface)}
.mini.on{background:var(--green50);border-color:var(--green600);color:var(--green600)}
.pri{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--blue50);color:var(--blue800);border:1px solid var(--blue200)}
.pri.p4{background:var(--amber50);color:var(--amber600);border-color:var(--amber200)}

.note{background:var(--amber50);border:1px solid var(--amber200);border-radius:8px;padding:12px 14px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--blue800);color:#fff;
  font-size:13px;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:92vw}
.toast.show{opacity:1}
.hide{display:none!important}
@media print{.ctl,button,input,select{display:none!important}}
</style>
</head>
<body>
<div class="wrap">

<nav style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)">
  <a class="navlink" href="./index.html" style="border:1px solid var(--line2);border-radius:8px;padding:4px 10px;color:var(--tx2)">← 84 天计划</a>
  <a class="navlink" href="./pany.html" style="border:1px solid var(--line2);border-radius:8px;padding:4px 10px;color:var(--tx2)">她的泰语 · 800 句</a>
  <span class="sub">当前：单词本</span>
</nav>

<h1>泰语单词本</h1>
<p class="sub">来源：manao-thai.com「Essential Thai Words」· priority 5（517）+ priority 4（1670）· 去重后共 2187 词 · 点任意行发音</p>

<div class="hero">
  <div class="kpis">
    <div class="kpi"><div class="l">总词数</div><div class="v" id="kTotal">0</div></div>
    <div class="kpi"><div class="l">当前筛选</div><div class="v" id="kShow">0</div></div>
    <div class="kpi"><div class="l">已标记掌握</div><div class="v" id="kLearned">0</div></div>
    <div class="kpi"><div class="l">掌握率</div><div class="v" id="kPct">0%</div></div>
  </div>
  <div class="bar"><i id="barMain"></i></div>
  <p class="sub" id="pos"></p>
</div>

<div class="ctl">
  <select id="priSel">
    <option value="5">Priority 5（517 · 最该先学）</option>
    <option value="4">Priority 4（1670）</option>
    <option value="all">全部（2187）</option>
  </select>
  <input type="text" id="q" placeholder="搜索泰文 / 转写 / 中文 / 英文" style="min-width:220px">
  <button class="btn on" id="tZh">中文</button>
  <button class="btn on" id="tEn">英文</button>
  <button class="btn on" id="tRom">转写</button>
  <button class="btn" id="tHideLearned">隐藏已掌握</button>
  <span class="sub">语速</span>
  <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.9">
  <button class="btn" id="btnExport">导出</button>
  <button class="btn" id="btnReset">清除标记</button>
</div>

<div class="note">
  <strong>发音：</strong>优先播放页面内置音频（离线可用）；没有对应文件时自动走在线接口（Google → 有道）。<br>
  <strong>释义：</strong>中文与英文同时显示，可单独关掉其中一个。中文为机器翻译，虚词类（如 ก็、ก็คือ）可能生硬，以英文为准。
</div>

<div class="list" id="list"></div>
<p class="sub" id="more"></p>

<div class="toast" id="toast"></div>
</div>

<script src="./words-data.js"></script>
<script>
var ALL = (window.WORDS5 || []).concat(window.WORDS4 || []);
var KEY = "thaiwordbook-v1";
var learned = {};
try { var raw = localStorage.getItem(KEY); if (raw) learned = JSON.parse(raw) || {}; } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(learned)); } catch(e){} }

var showZh = true, showEn = true, showRom = true, hideLearned = false, query = "", pri = "5";
var audio = null, lastEl = null;
var LIMIT = 150, shown = LIMIT;

var toastTimer = null;
function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function filtered(){
  var q = query.toLowerCase();
  return ALL.filter(function(w){
    if(pri !== "all" && String(w.p) !== pri) return false;
    if(hideLearned && learned[w.t]) return false;
    if(!q) return true;
    return (w.t + " " + w.r + " " + (w.z || "") + " " + w.e).toLowerCase().indexOf(q) >= 0;
  });
}

function render(){
  var arr = filtered();
  var slice = arr.slice(0, shown);
  var html = "";
  for(var i = 0; i < slice.length; i++){
    var w = slice[i];
    html += '<div class="w' + (learned[w.t] ? " learned" : "") + '" data-n="' + w.n + '" data-t="' + esc(w.t).replace(/"/g,"&quot;") + '">'
         +  '<span class="play">&#9654;</span>'
         +  '<div class="main">'
         +  '<div class="th">' + esc(w.t) + ' <span class="pri p' + w.p + '">P' + w.p + '</span></div>'
         +  (showRom && w.r ? '<div class="rom">' + esc(w.r) + '</div>' : "")
         +  (showZh && w.z ? '<div class="zh">' + esc(w.z) + '</div>' : "")
         +  (showEn && w.e ? '<div class="en">' + esc(w.e) + '</div>' : "")
         +  '</div><div class="side"><button class="mini' + (learned[w.t] ? " on" : "") + '" data-learn="' + esc(w.t).replace(/"/g,"&quot;") + '">' + (learned[w.t] ? "已掌握" : "掌握") + '</button></div></div>';
  }
  document.getElementById("list").innerHTML = html || '<div class="w"><div class="main"><div class="zh">没有匹配结果</div></div></div>';
  document.getElementById("more").textContent = (arr.length > shown) ? "已显示 " + shown + " / " + arr.length + " 条，继续滚动或缩小范围" : "共 " + arr.length + " 条";
  stats(arr.length);
}

function stats(shownCount){
  var total = 0, got = 0;
  for(var i = 0; i < ALL.length; i++){
    if(pri !== "all" && String(ALL[i].p) !== pri) continue;
    total++; if(learned[ALL[i].t]) got++;
  }
  document.getElementById("kTotal").textContent = ALL.length;
  document.getElementById("kShow").textContent = shownCount;
  document.getElementById("kLearned").textContent = got;
  var pct = total ? Math.round(got / total * 100) : 0;
  document.getElementById("kPct").textContent = pct + "%";
  document.getElementById("barMain").style.width = pct + "%";
  document.getElementById("pos").textContent = "当前范围 " + got + " / " + total + " 已标记掌握";
}

function speak(n, text, el){
  var idx = 0;
  var urls = ["audio-words/w" + n + ".mp3",
    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q=" + encodeURIComponent(text),
    "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(text) + "&le=th"];
  function tryPlay(){
    if(idx >= urls.length){ toast("发音失败：请检查网络或用别的方式"); if(el) el.classList.remove("playing"); return; }
    var u = urls[idx];
    var a = new Audio();
    a.playbackRate = Number(document.getElementById("rate").value);
    if(lastEl) lastEl.classList.remove("playing");
    if(el){ el.classList.add("playing"); lastEl = el; }
    a.onended = function(){ if(el) el.classList.remove("playing"); };
    a.onerror = function(){ idx++; tryPlay(); };
    audio = a;
    a.src = u;
    var p = a.play();
    if(p && p.catch) p.catch(function(){ a.onerror(); });
  }
  tryPlay();
}

document.getElementById("list").addEventListener("click", function(e){
  var lb = e.target.closest ? e.target.closest("[data-learn]") : null;
  if(lb){
    e.stopPropagation();
    var t = lb.getAttribute("data-learn");
    if(learned[t]) delete learned[t]; else learned[t] = 1;
    save(); render();
    return;
  }
  var row = e.target.closest ? e.target.closest(".w") : null;
  if(row) speak(parseInt(row.getAttribute("data-n"), 10), row.getAttribute("data-t"), row);
});

document.getElementById("q").addEventListener("input", function(e){ query = e.target.value.trim(); shown = LIMIT; render(); });
document.getElementById("priSel").addEventListener("change", function(e){ pri = e.target.value; shown = LIMIT; render(); });
function bindToggle(id, key){
  document.getElementById(id).addEventListener("click", function(){
    if(key === "zh") showZh = !showZh;
    else if(key === "en") showEn = !showEn;
    else if(key === "rom") showRom = !showRom;
    var on = key === "zh" ? showZh : (key === "en" ? showEn : showRom);
    this.classList.toggle("on", on);
    render();
  });
}
bindToggle("tZh", "zh"); bindToggle("tEn", "en"); bindToggle("tRom", "rom");
document.getElementById("tHideLearned").addEventListener("click", function(){
  hideLearned = !hideLearned; this.classList.toggle("on", hideLearned); render();
});
document.getElementById("btnReset").addEventListener("click", function(){
  if(!confirm("清除所有「已掌握」标记？")) return;
  learned = {}; save(); render();
});
document.getElementById("btnExport").addEventListener("click", function(){
  var arr = filtered(), lines = ["# 泰语单词本导出", ""];
  lines.push("- 来源：manao-thai.com essential（priority 5 + 4）");
  lines.push("- 导出时间：" + new Date().toLocaleString());
  lines.push("- 条数：" + arr.length, "");
  arr.forEach(function(w){
    lines.push("- " + w.t + "　" + w.r + "　" + (w.z || w.e) + (learned[w.t] ? "　[已掌握]" : ""));
  });
  var blob = new Blob([lines.join("\n")], {type:"text/markdown;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "泰语单词本.md";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
window.addEventListener("scroll", function(){
  if(shown >= filtered().length) return;
  if(window.innerHeight + window.scrollY > document.body.offsetHeight - 400){ shown += LIMIT; render(); }
});

render();
</script>
</body>
</html>
